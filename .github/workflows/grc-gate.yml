name: grc-gate

on:
  pull_request:
    branches:
      - main
jobs:
  grc-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Conftest (pinned version)
        run: |
          curl -fsSL -o conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.70.1/conftest_0.70.1_Linux_x86_64.tar.gz
          tar -xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/
          conftest --version
      - name: evidences
        run: |
          mkdir -p evidence
          conftest test --policy policies --namespace compliance.sc28_aws --namespace compliance.ac3_aws --namespace compliance.cm6_aws plan.json --output json > evidence/conftest-results.json
      - name: up_evidences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conftest-evidence
          path: evidence/